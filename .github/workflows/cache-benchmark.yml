name: Cache Invalidation Benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0' # Weekly benchmark sanity run

jobs:
  benchmark:
    name: Run Cache Evaluation Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Runtime Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Execute Quantitative Benchmark
        run: |
          python scripts/benchmark_performance.py
